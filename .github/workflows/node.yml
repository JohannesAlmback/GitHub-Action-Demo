name: SimpleCI

on:
  push: 
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubunto-latest

    strategy:
      matrix:
        node-versions: [18.x, 20.x, 22.x, 24.x]
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node jobs
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          cache: 'npm'
      - run: npm ci
      - run: npm test